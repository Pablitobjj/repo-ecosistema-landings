<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="cb-loop-title cb-loop-desc" lang="es">
 <title id="cb-loop-title">Cultural Brain — Ciclo continuo de inteligencia</title>
 <desc id="cb-loop-desc">Seis etapas conectadas forman un ciclo continuo en sentido horario: Conocer, Recomendar, Decidir, Ejecutar, Medir y Aprender. El aprendizaje validado regresa a la base de conocimiento.</desc>
 <defs>
   <linearGradient id="cb-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A98BE4"/><stop offset=".31" stop-color="#55BFC9"/><stop offset=".65" stop-color="#E4A779"/><stop offset="1" stop-color="#7D76D1"/></linearGradient>
   <radialGradient id="cb-core" cx=".45" cy=".35" r=".72"><stop offset="0" stop-color="#263E76"/><stop offset=".55" stop-color="#17284D"/><stop offset="1" stop-color="#101A37"/></radialGradient>
   <radialGradient id="cb-glow"><stop offset="0" stop-color="#6E4AA7" stop-opacity=".34"/><stop offset="1" stop-color="#6E4AA7" stop-opacity="0"/></radialGradient>
   <filter id="cb-blur"><feGaussianBlur stdDeviation="15"/></filter>
   <filter id="cb-light"><feGaussianBlur stdDeviation="4"/></filter>
 </defs>
 <style>
 svg{font-family:Raleway,Arial,sans-serif;background:transparent;overflow:visible}
 .cb-ring-orbit{stroke-dasharray:4 10;animation:cb-dash 34s linear infinite}
 .cb-spinner{transform-origin:360px 370px;animation:cb-orbit 30s linear infinite}
 .cb-breathe{transform-origin:360px 370px;animation:cb-breathe 7s ease-in-out infinite}
 .cb-core-pulse{transform-origin:360px 370px;animation:cb-breathe 7s ease-in-out infinite}
 .stage-halo{animation:cb-node-pulse 7s ease-in-out infinite}
 .stage:nth-of-type(2) .stage-halo{animation-delay:-1s}
 .stage:nth-of-type(3) .stage-halo{animation-delay:-2s}
 .stage:nth-of-type(4) .stage-halo{animation-delay:-3s}
 .stage:nth-of-type(5) .stage-halo{animation-delay:-4s}
 .stage:nth-of-type(6) .stage-halo{animation-delay:-5s}
 svg.is-paused *,svg.is-paused *::before,svg.is-paused *::after{animation-play-state:paused!important}
 @keyframes cb-orbit{to{transform:rotate(360deg)}}
 @keyframes cb-dash{to{stroke-dashoffset:-350}}
 @keyframes cb-breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.028);opacity:1}}
 @keyframes cb-node-pulse{0%,100%{stroke-opacity:.6}50%{stroke-opacity:1}}
 @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
 </style>
